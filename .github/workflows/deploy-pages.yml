name: Deploy to GitHub Pages

on:
  push:
    # Change this to whichever branch you deploy from.
    branches: [main, master]
  workflow_dispatch:

# Required by actions/deploy-pages: read the repo, publish to Pages, and mint
# an OIDC token that proves the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight production deployment finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reads the Pages settings, enables Pages on first run, and exposes the
      # site's origin and path prefix to later steps.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Project sites live under /<repo>/; user pages and custom domains do not.
      # A public/CNAME file signals a custom domain, so no prefix is applied.
      - name: Resolve base path
        id: base_path
        run: |
          if [ -f public/CNAME ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.base_path.outputs.value }}
          # Set a repository variable named SITE_URL to override, e.g. when the
          # site is served from https://aitechx.vn.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
